# Optional macro buttons. Install the complete dev module first, then include
# this file from printer.cfg if desired. See docs/TRAVEL.md for preparation.
# Neither button releases motors, centers a carriage nor requests Z movement.
# Prepare both XY axes unhomed and approximately centered before opening.

[gcode_macro TRAVEL_CALIBRATION]
description: Open or reopen guided X/Y travel and bed-zero calibration
gcode:
    ACCEL_HOMING_TRAVEL

[gcode_macro TRAVEL_CALIBRATION_CANCEL]
description: Cancel guided calibration (not an emergency stop)
gcode:
    ACCEL_HOMING_CANCEL
