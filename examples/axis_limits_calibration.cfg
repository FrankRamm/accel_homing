# Optional macro buttons. Install the plugin first, then include this file
# from printer.cfg if desired. See docs/advanced/axis-limits.md for preparation.
# Neither button releases motors, centers a carriage nor requests Z movement.
# Prepare both XY axes unhomed and approximately centered before opening.

[gcode_macro AXIS_LIMITS_CALIBRATION]
description: Open or reopen guided X/Y axis limits and bed-zero calibration
gcode:
    ACCEL_HOMING_CALIBRATE_LIMITS

[gcode_macro AXIS_LIMITS_CALIBRATION_CANCEL]
description: Cancel guided calibration (not an emergency stop)
gcode:
    ACCEL_HOMING_CANCEL
