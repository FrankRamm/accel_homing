# Editable example, not an additional duplicate of the installer-created section.
# Configure your normal accelerometer/MCU firmware and axes_map separately first.
# Install also registers the correlated Moonraker native Git updater and
# automatically activates its verified selected service when needed.
# Install/update automatically restarts the verified selected Klipper service
# after an idle recheck; it may request your sudo password. --no-restart opts out.
# After that opt-out, uninstall or module-link rollback, manually restart the
# selected Klipper host process while idle, using the printed service.
# Console RESTART is sufficient for later configuration-only threshold edits;
# RESTART/FIRMWARE_RESTART do not reload already imported Python modules.
[accel_homing]
accel_chip: auto
#    Exactly one recognized configured object is required for auto.
#    Otherwise use its full section name, for example adxl345 toolhead, beacon,
#    lis2dw toolhead, or adxl345 ToolHead (suffix case is preserved).
#    Cartographer's [scanner]/probe section is not an accelerometer: configure
#    and select its separate standard [adxl345 ...] or [lis2dw ...] object.

#x_threshold: 8.0
#y_threshold: 8.0
#    Independent manual overrides in g; commented by default so a saved model
#    can supply each axis. Explicit values win over model values on restart.
#    Manual overrides accept any finite positive value in g, including below
#    0.5g. No fixed 3g minimum or 15g maximum applies. When the sensor range is
#    known, each active threshold must be at most 80% of that range; the actual
#    stream range is checked again before arming. Calibration defaults to 1g.
#    Default generic threshold is sensor-aware, normally 8g for a 16g driver,
#    4g for the verified 8g MPU9250 driver. Do not paste 8g for MPU9250.
#threshold: 8.0
#    Historical shared fallback. Explicit threshold also overrides both model
#    defaults; leave it absent when using calibrated per-axis models.
#model: default
#    Named [accel_homing_model default] stored by SAVE_CONFIG in printer.cfg.
#    Do not paste or edit the generated model in the DO NOT EDIT block.

#x_impact_sign: 0
#y_impact_sign: 0
#    0 uses automatic direction detection. 1/-1 are expert overrides for the
#    already machine-mapped acceleration. Wrong signs can miss the stop.
#homing_accel: 5000
#    Upper limit while homing, during final release and early reversals;
#    preserves a lower live acceleration and restores it afterward.
#back_off_dist: 5
#    Cross-axis release plus final release after a successful ordinary XY home,
#    mm; finite 0-20, zero disables. One touch still uses homing_retract_dist: 0.
#    Final release runs after coordinate corrections, away from each just-homed
#    stop at rail retract speed, bounded by rail limits; existing firmware
#    release is not repeated. No Z move. Accepted intermediate workflow trials
#    return to center as before; only a fully qualified successful workflow's
#    final tested axis releases. Failed/suspect/cancelled trials do not retract.
#enable_settle_time: 0.25
#    Seconds after enabling a disabled homing motor; finite values 0-2.
#    CoreXY enables both drives. Zero retains the fresh quiet-data check.
#baseline_time: 0.1
#    Each pass waits for queued setup/backoff/retract to finish, then requires
#    >=50 fresh contiguous samples over this duration. Preparation times out
#    after baseline_time+0.5s if no complete quiet window qualifies. This also
#    applies to already enabled motors and second touches. A rolling candidate
#    retains useful recent samples when an older extreme widens the range.
#    The full duration, all-axis range and freshness checks still apply.
#    Earlier buffered samples cannot qualify. No post-arm impact is ignored;
#    the check does not change driver current or hold_current.
#    Simple CALIBRATE and its saved XYZ-magnitude models use only the fresh
#    offset: no quietness gate, noise-envelope proof or startup motion deadline.
#    Legacy manual thresholds/older models retain the quiet/motion rules.
#    Missing/stale/invalid sensor data still stops either detector.
#baseline_noise_floor: 0.7
#    Generic configured accelerometers only, including Cartographer's ADXL/LIS.
#    Finite g value from 0 to 0.7. Per-axis stationary peak-to-peak limit is
#    max(0.20 * active impact threshold, baseline_noise_floor). Zero restores
#    the previous 20% rule. At a 1g homing threshold, the default quiet limit
#    is 0.7g; the actual impact threshold stays 1g. An explicit older floor
#    remains active; set it to 0.7 to use the wider default allowance.
#    Simple calibration and new vector models do not enforce this limit.
#    The motion-proof details below apply to the legacy detector only.
#    Native Beacon separately uses
#    max(0.20 * threshold, min(0.5g, threshold)); this option does not change it.
#    For an accepted generic reference above the old gate, movement proof
#    discounts each axis's maximum observed deviation from its accepted mean.
#    Automatic direction needs a signed interval >=+30mm/s or <=-30mm/s;
#    uncertain drift keeps detection bidirectional. Raw impacts, manual
#    direction overrides and the startup deadline stay unchanged. Assumes later
#    stationary noise stays within those bounds; noisy/slow cases may fail
#    no_motion without a speed/threshold increase. Synthetic validation only.
#    Expanded native Beacon references use bounded motion/pressed decisions;
#    ambiguous motion fails no_motion, with no raw-impact blanking interval.
#stream_timeout: 0.05
#travel_margin: 1.1
#watchdog_margin: 0.15
#    Detector timing/stop guards. Not hard real-time guarantees.

#stream_interval: 0.005
#max_sample_age: 0.050
#min_sample_rate: 1000
#    Generic configured-sensor delivery guards (seconds, seconds, Hz).
#    The 50ms default applies during preparation and armed homing. Explicit
#    max_sample_age and shorter stream_timeout values are preserved.
#    Reporting interval is temporarily shortened and restored afterwards.
#    There is no default 50mm/s cap or startup-distance admission limit.
#    Any finite positive configured homing_speed is preserved; normal toolhead
#    velocity/acceleration limits and actual freshness/fault checks still apply.
#    Timing/acceleration are not auto-edited.
#    In the legacy detector only, while no impact has completed the generic
#    home, its startup guard fails
#    with no_motion if proof is absent by the ramp/lag/report deadline. It never
#    treats a stationary generic sensor as a successful already-pressed home.
#    Ordinary G28 may finish on a fresh threshold impact before motion proof;
#    legacy test/charts additionally reject suspect motion/travel.
#    Simple calibration and vector models omit this startup-motion estimator.
#max_report_travel: 1.0
#max_startup_travel: 3.0
#    OPTIONAL distance caps, both disabled when absent. The values above are
#    opt-in examples, not defaults; do not uncomment them just to set a speed.
#    Explicit max_report_travel accepts finite 0.1-2mm values and caps effective
#    speed at max_report_travel/max_sample_age. max_startup_travel accepts
#    finite 0.1-5mm values and caps nominal travel before the host stop request.
#    Each configured limit is honored independently; neither changes the
#    startup deadline. Omit the option to disable it; do not write None.
#    Host stalls, transport/MCU stop delay and mechanical response are excluded,
#    so these are not physical stopping-distance guarantees.
#    Runtime checks use live velocity/acceleration, even after a macro changes
#    them. homing_accel only caps live acceleration; zero leaves it unchanged.
#    CALIBRATE/TEST/CHARTS check generic plans before workflow effects.
#    The separate calibration rule is max(travel)-min(travel) <=2mm across ten
#    accepted validation homes, not a per-home travel cap or stopping guarantee.
#    Installer flags --max-report-travel / --max-startup-travel explicitly
#    persist these global limits; otherwise existing values are preserved.
#    Native Beacon rejects those generic policy flags.
#sensor_range: 16
#    Actual configured sensor range in g, required for an unknown compatible
#    object; never infer it from the brand. Standard drivers have known ranges.

#calibration_start_threshold: 1.0
#calibration_step: 0.25
#    Start/model thresholds: finite and >=0.5g; STEP: finite 0.1-3g.
#    No configurable calibration g ceiling or fixed 15g maximum.
#    Legacy calibration_max_threshold is accepted but ignored with a warning.
#calibration_max_attempts: 40
#calibration_confirm_timeout: 300
#calibration_travel_tolerance: 0.20
#    Inclusive tolerance around the configured midpoint-to-endstop distance
#    required to qualify discovery/validation impacts beyond 20mm; default 20%.
#    Triggers below the lower band use the recorded-displacement return/retry.
#    Recovery shares the command's attempt budget. There is no accumulated
#    distance budget or separate recovery-count cap.
#calibration_settle_time: 0.25
#    CALIBRATE and ACCURACY wait this long after completed midpoint returns,
#    before the next fresh reference. Finite 0-2; zero disables this extra wait.
#    Midpoint returns share ordinary acceleration restored after homing.
#    Early reversals retain their homing_accel cap and this wait.
#    This can let transient ringing decay; ordinary vibration can still
#    produce early impacts. TEST/CHARTS returns and homing speed/cap are unchanged.
#workflow_reposition_speed: 50
#    Known-range thresholds stay <=80% of range as software headroom policy,
#    separate from physical saturation and sensor-fault checks.
#    Each fresh per-axis CALIBRATE measures three stationary 1s XYZ windows
#    before movement, once per command rather than per candidate retry.
#    Fresh XYZ magnitude selects the initial candidate on the configured grid;
#    default origin/step are 1g/.25g. Existing start/step settings are preserved.
#    STEP alone changes grid spacing and still uses fresh noise. Explicit
#    START_THRESHOLD=1 STEP=0.25 fixes those values but still measures noise.
#    Changing a pending run's start/step is rejected.
#    calibration_start_threshold retains its 0.5g minimum. Saved model
#    thresholds stay until recalibration. The independent 40-attempt limit
#    includes discovery and validation; not every configured grid fits it.
#    Before another candidate, 11 attempts must remain for a fresh discovery
#    and ten checks, before the retry's return/increase/recentering.
#    Separate ACCEL_HOMING_CALIBRATE_NOISE records three stationary 1s
#    XYZ windows and exports one completed PNG with three signed plots, with
#    independent means, absolute peaks, RMS and peak-to-peak values in g.
#    Idle/unpaused, empty motion queue and exclusive sensor required; no
#    centering, homing, motor enable/release, move, SAVE_CONFIG or restart.
#    Standalone mapped X/Y hints are diagnostic and are not reused by CALIBRATE.
#    CALIBRATE's fresh XYZ-magnitude peak + max(20% of peak, 0.1g) rounds UP on
#    the configured start+n*STEP grid. Unknown range or a seed above the 80%
#    known-range headroom limit aborts unless START_THRESHOLD is explicit.
#    Measurement or PNG-export faults always abort before movement. Noise does
#    not measure motor-start/travel transients or establish a minimum threshold.
#    CALIBRATE uses baseline-subtracted XYZ magnitude, not a selected channel.
#    No axes_map/sign is needed for this detector; retain valid sensor config
#    for resonance testing and other Klipper features.
#
#    ACCEL_HOMING_CALIBRATE AXIS=X CENTERED=1
#    Same syntax; X/Y chooses the printer axis to move. XY must initially be
#    manually centered and unhomed, with Z supported and clear of the bed.
#    At each candidate: home toward the stop until an impact occurs.
#    A hit at/before 20mm or below the lower expected-distance band stops.
#    Reverse the recorded signed start-to-halt displacement; 2mm to the halt
#    means a 2mm reverse command. After the queued move and settling complete,
#    advance one STEP and retry discovery. Failed/interrupted returns abort
#    without advancing the threshold or completed-return count.
#    Merely reaching 20mm never stops the move or selects the candidate.
#    To qualify, discovery and validation impacts must be beyond 20mm and fit
#    the midpoint-to-endstop band within calibration_travel_tolerance.
#    A >20mm hit above the upper band aborts without return or threshold increase;
#    manually center XY and prepare a new command. Distance does not prove contact.
#    No accumulated-distance or overshoot/nominal-clearance gate is applied,
#    and there is no extra check of physical arrival. Ordinary firmware movement
#    limits/errors and current-record/finite-number/fault/cancel checks remain.
#    Recovery telemetry stores the completed count and last signed return only.
#    See docs/SIMPLE_CALIBRATION.md.
#    A plausible discovery AFTER 20mm selects the candidate; exclude its distance.
#    Center only that printer axis at its configured midpoint, then measure
#    ten center-to-impact distances, recentering that axis between checks.
#    max(distance)-min(distance) <=2.00mm passes, exactly 2mm included.
#    Check the running spread after every impact: >2mm rejects immediately,
#    raises the candidate by STEP, discards the window and restarts discovery.
#    Ten fresh passing checks are still required after the new discovery.
#    Centering assumes genuine endstop contact. Step counts are not encoders;
#    recovery does not prove physical return or automatically diagnose binding.
#    Data faults, missing impact or an exhausted attempt budget abort
#    without save. The known-range headroom policy still bounds candidates.
#    Defaults: 1g grid origin, .25g step, 40 monitored attempts, .25s settling.
#    Successful SAVE_CONFIG=1 (default) saves and restarts; =0 stages only.
#    New models carry the vector metric for ordinary G28 after reload. Explicit
#    manual overrides and legacy models retain their prior selected-axis metric.
#    See ../docs/SIMPLE_CALIBRATION.md for the algorithm and limitations.
#
#    Each new command still requires manual XY centering while both are unhomed.
#    Calibration saves its axis and restarts by default (SAVE_CONFIG=1).
#    SAVE_CONFIG=0 only stages the model in memory; it does not change ordinary
#    homing thresholds. Run SAVE_CONFIG manually to write/restart and activate
#    the model after reload (manual overrides still take priority). An ordinary
#    RESTART discards unsaved staged values.
#charts_directory: ~/printer_data/config/accel_homing_charts
#    Default actually follows the selected main printer.cfg's directory.
#    Every chart is PNG only, with the same local YYYY-MM-DD HH:MM:SS timestamp
#    in its descriptive filename/title. No CSV/JSON/SVG/HTML sidecars. Curves use a
#    bounded extrema-preserving envelope; there is no full raw-sample export.
#    ACCURACY keeps one final PNG per requested axis. Per-home PNGs are temporary
#    outside the chart/config roots and are removed after export or abort/cancel;
#    NOISE keeps its three windows in memory and publishes one three-panel PNG.
#    The installer prepares isolated plotting dependencies; a worker-render
#    preflight runs before chart movement/acquisition. STATUS lists PNG paths.

# The installer edits these options in your EXISTING stepper sections:
# [stepper_x]
# endstop_pin: accel_homing:x
# homing_retract_dist: 0
# [stepper_y]
# endstop_pin: accel_homing:y
# homing_retract_dist: 0
# It preserves configured homing_speed for every sensor. Explicit optional
# reporting or startup-request limits are honored before installation writes;
# no automatic cap/reduction is applied. Only explicit --homing-speed requests
# a speed edit, still subject to those limits. Acceleration is never raised.
# An update keeps a speed written by an older installer; it does not infer or
# automatically restore the original speed from retained backup history.
# It comments X/Y TMC diag_pin/diag0_pin/diag1_pin/home_current and rail
# homing_accel/min_home_dist, leaving run_current and unrelated axes untouched.
# Calibration/test/charts/accuracy require Cartesian/CoreXY, independent Z and
# a sensor moving with each tested axis. Stock G28 is supported directly or
# beneath one verified standard Klipper/Kalico safe_z_home or homing_override.
# Workflow X/Y homes bypass the entire wrapper, including forced set_position
# and override G-code. Normal G28, SYNC_MOTORS, Z and Beacon retain their
# configured sequence and settings. The two built-in sections cannot coexist.
# Public G28 X/Y can still Z-hop before a later X/Y policy refusal; workflow
# preflight does not intercept public G28 or change safe_z_home/Z settings.
# G28 macros and nested/unknown/custom wrapper chains are rejected by workflows.
